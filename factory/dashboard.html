<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Software Factory</title>
<style>
  :root {
    --bg: #0b1220; --surface: #111d30; --surface-2: #16243a; --border: #1e293b;
    --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8;
    --pass: #10b981; --changes: #f59e0b; --human: #f59e0b; --merged: #10b981;
    --mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --border: #e2e8f0;
      --text: #0f172a; --muted: #475569; --accent: #0369a1;
      --pass: #047857; --changes: #b45309; --human: #b45309; --merged: #047857;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 20px 24px; border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
  header h1 span { color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; margin-inline-start: auto; font-family: var(--mono); }
  .alert {
    display: none; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: color-mix(in srgb, var(--human) 18%, transparent); color: var(--human);
  }
  .alert.on { display: inline-block; }
  .banner { margin: 16px 24px 0; padding: 12px 16px; border: 1px solid var(--changes); border-radius: 10px; color: var(--muted); display: none; }
  .banner.on { display: block; }
  .banner code { font-family: var(--mono); color: var(--text); }

  .board {
    display: grid; grid-template-columns: repeat(6, minmax(220px, 1fr));
    gap: 12px; padding: 20px 24px; overflow-x: auto; align-items: start;
  }
  .col { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; min-height: 160px; }
  .col h2 {
    margin: 0; padding: 12px 14px; font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; display: flex; justify-content: space-between;
  }
  .col h2 small { font-family: var(--mono); }
  .col h2 .arrow { color: var(--border); }
  .col.human { border-color: color-mix(in srgb, var(--human) 55%, transparent); background: color-mix(in srgb, var(--human) 7%, var(--surface-2)); }
  .col.human h2 { color: var(--human); }
  .cards { display: flex; flex-direction: column; gap: 10px; padding: 0 10px 12px; }
  .empty { color: var(--muted); font-size: 12px; padding: 4px 4px 8px; opacity: .6; }

  .card {
    all: unset; display: block; cursor: pointer; background: var(--surface);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px;
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--accent); }
  .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .card.human { border-color: var(--human); box-shadow: 0 0 0 3px color-mix(in srgb, var(--human) 18%, transparent); }
  .card.active { border-color: var(--accent); }
  .id { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .id > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .id > span:last-child { white-space: nowrap; }
  .wt { font-family: var(--mono); font-size: 11px; color: var(--accent); margin-top: 8px; }
  .title { font-weight: 600; margin: 4px 0 8px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .card.human .note { color: var(--human); }
  .rounds { display: flex; flex-direction: column; gap: 4px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round b { font-family: var(--mono); font-size: 10px; color: var(--muted); width: 22px; font-weight: 500; }
  .chip {
    font-family: var(--mono); font-size: 10px; padding: 2px 6px; border-radius: 6px;
    border: 1px dashed var(--border); color: var(--muted);
  }
  .chip.PASS { border: 1px solid transparent; background: color-mix(in srgb, var(--pass) 18%, transparent); color: var(--pass); }
  .chip.CHANGES { border: 1px solid transparent; background: color-mix(in srgb, var(--changes) 18%, transparent); color: var(--changes); }
  .chip.pending { animation: pulse 1.6s ease-in-out infinite; }
  .chip.APPROVE { border: 1px solid transparent; background: color-mix(in srgb, var(--merged) 18%, transparent); color: var(--merged); }
  .chip.ESCALATE { border: 1px solid transparent; background: color-mix(in srgb, var(--human) 18%, transparent); color: var(--human); }
  @keyframes pulse { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .chip.pending { animation: none; } .card { transition: none; } }

  /* drawer */
  .drawer {
    position: fixed; inset-block: 0; inset-inline-end: 0; width: min(760px, 100vw);
    background: var(--surface); border-inline-start: 1px solid var(--border);
    display: none; grid-template-rows: auto 1fr; box-shadow: -20px 0 40px rgb(0 0 0 / .3); z-index: 10;
  }
  .drawer.open { display: grid; }
  .drawer-head { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .drawer-head h3 { margin: 0; font-size: 15px; }
  .drawer-head .id { margin-inline-start: 4px; }
  .close { all: unset; cursor: pointer; margin-inline-start: auto; color: var(--muted); font-size: 20px; padding: 0 6px; border-radius: 6px; }
  .close:focus-visible { outline: 2px solid var(--accent); }
  .drawer-body { display: grid; grid-template-columns: 190px 1fr; min-height: 0; }
  .files { border-inline-end: 1px solid var(--border); overflow-y: auto; padding: 10px; }
  .files h4 { margin: 12px 6px 4px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .file {
    all: unset; display: flex; justify-content: space-between; gap: 6px; width: 100%; box-sizing: border-box;
    cursor: pointer; padding: 6px 8px; border-radius: 6px; font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .file:hover, .file.active { background: var(--surface-2); color: var(--text); }
  .file:focus-visible { outline: 2px solid var(--accent); }
  .file .dot { width: 8px; height: 8px; border-radius: 50%; align-self: center; background: var(--border); flex: none; }
  .file .dot.PASS, .file .dot.APPROVE { background: var(--pass); }
  .file .dot.CHANGES, .file .dot.ESCALATE { background: var(--changes); }
  .doc { overflow-y: auto; padding: 20px 28px 48px; }
  @media (max-width: 640px) { .drawer-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } .files { border-inline-end: 0; border-bottom: 1px solid var(--border); max-height: 30vh; } }

  /* markdown */
  .md { max-width: 72ch; line-height: 1.65; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 16px; margin-top: 24px; } .md h3 { font-size: 14px; }
  .md code { font-family: var(--mono); font-size: 12px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--surface-2); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md a { color: var(--accent); }
  .md table { border-collapse: collapse; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--border); padding: 4px 8px; text-align: start; }
  .md .verdict { display: inline-block; font-family: var(--mono); font-weight: 700; padding: 4px 10px; border-radius: 8px; margin: 0 0 8px; }
  .md .verdict.PASS, .md .verdict.APPROVE { background: color-mix(in srgb, var(--pass) 18%, transparent); color: var(--pass); }
  .md .verdict.CHANGES, .md .verdict.ESCALATE { background: color-mix(in srgb, var(--changes) 18%, transparent); color: var(--changes); }
</style>
</head>
<body>
<header>
  <h1>Software <span>Factory</span></h1>
  <span class="alert" id="alert"></span>
  <span class="meta" id="meta">loading…</span>
</header>
<div class="banner" id="banner">
  Can't read <code>board.json</code>. Serve this folder: <code>cd factory &amp;&amp; python3 -m http.server 8765</code>
  then open <code>http://localhost:8765/dashboard.html</code>.
</div>
<main class="board" id="board"></main>

<aside class="drawer" id="drawer" aria-label="Job files">
  <div class="drawer-head">
    <h3 id="d-title"></h3><span class="id" id="d-id"></span>
    <button class="close" id="d-close" aria-label="Close">×</button>
  </div>
  <div class="drawer-body">
    <nav class="files" id="d-files"></nav>
    <article class="doc"><div class="md" id="d-doc"></div></article>
  </div>
</aside>

<script>
const STAGES = [
  { key: "spec", label: "Spec" },
  { key: "build", label: "Build" },
  { key: "review", label: "Review" },
  { key: "decision", label: "Decision" },
  { key: "merged", label: "Merged" },
  { key: "needs-human", label: "Needs human" },
];
const REVIEWERS = [
  { key: "security", label: "SEC", file: "review-security.md" },
  { key: "ux", label: "UX", file: "review-ux.md" },
  { key: "ui", label: "UI", file: "review-ui.md" },
  { key: "code", label: "CODE", file: "review-code.md" },
];
const POLL_MS = 2000;

let board = { jobs: [] };
let boardText = "";
let openJobId = null;
let openFile = null;
let fileCache = {};   // path -> text | null (missing)

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return `${Math.round(s)}s ago`;
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  return `${Math.round(s / 86400)}d ago`;
}

function chips(reviews) {
  return REVIEWERS.map((r) => {
    const v = reviews?.[r.key] ?? "pending";
    return `<span class="chip ${esc(v)}" title="${r.key}: ${esc(v)}">${r.label}</span>`;
  }).join("");
}

function roundRows(job) {
  const rows = (job.rounds ?? []).map((r) => `<div class="round"><b>R${r.round}</b>${chips(r.reviews)}</div>`);
  if (job.stage === "review" && job.reviews) rows.push(`<div class="round"><b>R${job.round}</b>${chips(job.reviews)}</div>`);
  if (job.decision) rows.push(`<div class="round"><b></b><span class="chip ${esc(job.decision)}">${esc(job.decision)}</span></div>`);
  return rows.length ? `<div class="rounds">${rows.join("")}</div>` : "";
}

function renderBoard() {
  const jobs = board.jobs ?? [];
  const human = jobs.filter((j) => j.stage === "needs-human").length;
  $("alert").textContent = `${human} need${human === 1 ? "s" : ""} you`;
  $("alert").classList.toggle("on", human > 0);

  setHTML($("board"), STAGES.map((stage, i) => {
    const inStage = jobs.filter((j) => j.stage === stage.key)
      .sort((a, b) => String(b.updated ?? "").localeCompare(String(a.updated ?? "")));
    const cards = inStage.map((j) => `
      <button class="card ${j.stage === "needs-human" ? "human" : ""} ${j.id === openJobId ? "active" : ""}" data-id="${esc(j.id)}">
        <div class="id"><span title="${esc(j.id)}">${esc(j.id)}</span><span>${j.round ? "round " + j.round : ""}</span></div>
        <div class="title">${esc(j.title ?? j.id)}</div>
        ${roundRows(j)}
        ${j.note ? `<div class="note">${esc(j.note)}</div>` : ""}
        ${j.worktree && j.stage !== "merged" ? `<div class="wt">${esc(j.worktree)}${j.port ? " · :" + esc(j.port) : ""}</div>` : ""}
      </button>`).join("");
    const arrow = i < 4 ? '<span class="arrow">→</span>' : "";
    return `<section class="col ${stage.key === "needs-human" ? "human" : ""}">
      <h2><span>${stage.label} ${arrow}</span><small>${inStage.length}</small></h2>
      <div class="cards">${cards || '<div class="empty">—</div>'}</div>
    </section>`;
  }).join(""));

  renderMeta();
}

function renderMeta() {
  const jobs = board.jobs ?? [];
  const latest = jobs.map((j) => j.updated).filter(Boolean).sort().pop();
  $("meta").textContent = `${jobs.length} job${jobs.length === 1 ? "" : "s"}${latest ? " · updated " + ago(latest) : ""}`;
}

// Only touch the DOM when the markup changed, so polling never steals focus.
const rendered = new WeakMap();
function setHTML(el, html) { if (rendered.get(el) !== html) { el.innerHTML = html; rendered.set(el, html); } }

/* ── files of a job: derived from the board, missing ones are skipped ── */
function jobFiles(job) {
  const base = `jobs/${job.id}/`;
  const groups = [{ title: "Job", files: [base + "spec.md", base + "build.md"] }];
  for (let n = 1; n <= (job.round ?? 0); n++) {
    groups.push({
      title: `Round ${n}`,
      files: [`${base}round-${n}/feedback-human.md`, ...REVIEWERS.map((r) => `${base}round-${n}/${r.file}`)],
    });
  }
  groups.push({ title: "Outcome", files: [base + "decision.md"] });
  return groups;
}

async function fetchText(path) {
  try {
    const res = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
    return res.ok ? await res.text() : null;
  } catch { return null; }
}

function firstWord(text) {
  const line = (text ?? "").trimStart().split("\n")[0].replace(/^VERDICT:\s*/, "").trim();
  return /^(PASS|CHANGES|APPROVE|ESCALATE)\b/.exec(line)?.[1] ?? "";
}

async function renderDrawer() {
  const job = (board.jobs ?? []).find((j) => j.id === openJobId);
  if (!job) return closeDrawer();
  $("d-title").textContent = job.title ?? job.id;
  $("d-id").textContent = `${job.id} · ${job.branch ?? ""}`;

  const groups = jobFiles(job);
  const all = groups.flatMap((g) => g.files);
  await Promise.all(all.map(async (p) => { fileCache[p] = await fetchText(p); }));

  const present = all.filter((p) => fileCache[p] != null);
  if (!openFile || !present.includes(openFile)) openFile = present[0] ?? null;

  setHTML($("d-files"), groups.map((g) => {
    const items = g.files.filter((p) => fileCache[p] != null).map((p) => {
      const name = p.split("/").pop();
      return `<button class="file ${p === openFile ? "active" : ""}" data-path="${esc(p)}">
        <span>${esc(name)}</span><span class="dot ${firstWord(fileCache[p])}"></span></button>`;
    }).join("");
    return items ? `<h4>${g.title}</h4>${items}` : "";
  }).join("") || '<div class="empty">No files yet.</div>');

  setHTML($("d-doc"), openFile ? markdown(fileCache[openFile]) : "");
}

function openDrawer(id) { openJobId = id; openFile = null; $("drawer").classList.add("open"); renderBoard(); renderDrawer(); $("d-close").focus(); }
function closeDrawer() {
  const id = openJobId;
  openJobId = null; $("drawer").classList.remove("open"); renderBoard();
  document.querySelector(`.card[data-id="${CSS.escape(id ?? "")}"]`)?.focus();
}

/* ── minimal markdown: headings, lists, code, tables, paragraphs, inline ── */
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

function markdown(src) {
  const lines = String(src ?? "").replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  const first = lines.findIndex((l) => l.trim());
  const verdict = firstWord(lines[first]);
  if (verdict) { out.push(`<div class="verdict ${verdict}">${esc(lines[first].trim())}</div>`); i = first + 1; }

  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*\|/.test(line)) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const body = rows.filter((r) => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out.push("<table>" + body.map((r, n) => "<tr>" + cells(r).map((c) => n === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join("") + "</tr>").join("") + "</table>");
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${inline(t.replace(/^\[( |x)\]\s*/, (m, x) => x === "x" ? "☑ " : "☐ "))}</li>`).join("")}</${tag}>`);
      continue;
    }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|\s*\||\s*([-*]|\d+\.)\s)/.test(lines[i])) para.push(lines[i++]);
    out.push(`<p>${inline(para.join(" "))}</p>`);
  }
  return out.join("\n");
}

/* ── events + polling ── */
$("board").addEventListener("click", (e) => { const c = e.target.closest(".card"); if (c) openDrawer(c.dataset.id); });
$("d-files").addEventListener("click", (e) => {
  const f = e.target.closest(".file"); if (!f) return;
  openFile = f.dataset.path; renderDrawer();
});
$("d-close").addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openJobId) closeDrawer(); });

async function poll() {
  const text = await fetchText("board.json");
  $("banner").classList.toggle("on", text == null);
  if (text != null && text !== boardText) {
    try { board = JSON.parse(text); boardText = text; renderBoard(); if (openJobId) renderDrawer(); }
    catch { /* orchestrator mid-write; try again next tick */ }
  } else if (openJobId) {
    renderDrawer();   // agents write markdown files without touching the board
  } else {
    renderMeta();     // refresh "updated … ago"
  }
}
poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
